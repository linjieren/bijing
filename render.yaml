services:
  - type: web
    name: bijing-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_API_URL
        value: https://api.moonshot.cn/v1/chat/completions
      - key: KIMI_MODEL
        value: moonshot-v1-8k
    healthCheckPath: /health
